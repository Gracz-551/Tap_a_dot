<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Złap kropkę — mini gra</title>
  <style>
    :root { color-scheme: dark; --ink:#eef7ff; --muted:#a5bbcc; --panel:#101e2b; --line:#284052; --mint:#55e6bd; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px; color:var(--ink); font:16px/1.5 system-ui,Segoe UI,sans-serif; background:radial-gradient(ellipse at 50% 10%,#153752,#07111b 65%); }
    .game { width:min(700px,100%); }
    header { text-align:center; margin-bottom:18px; }
    h1 { margin:0; font-size:clamp(2rem,6vw,3.4rem); letter-spacing:-.055em; }
    header p { margin:5px 0 0; color:var(--muted); }
    .panel { padding:16px; border:1px solid var(--line); border-radius:20px; background:#0e1a26eF; box-shadow:0 20px 70px #0005; }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px; }
    .stat { text-align:center; padding:9px; border-radius:12px; background:#142636; color:var(--muted); font-size:.82rem; }
    .stat strong { display:block; color:var(--ink); font-size:1.55rem; font-variant-numeric:tabular-nums; }
    .arena { position:relative; height:min(54vh,390px); min-height:260px; overflow:hidden; border:1px solid #2b4559; border-radius:15px; background-color:#09141e; background-image:radial-gradient(#233849 1px,transparent 1px); background-size:22px 22px; }
    #target { position:absolute; display:none; width:54px; aspect-ratio:1; border:0; border-radius:50%; cursor:pointer; touch-action:manipulation; background:radial-gradient(circle at 35% 30%,#d4fff4,#55e6bd 42%,#16a68b 100%); box-shadow:0 0 24px #55e6bd88,inset 0 -5px 9px #087b68aa; transition:transform .12s; }
    #target:hover { transform:scale(1.08); }
    #target:active { transform:scale(.86); }
    .message { position:absolute; inset:0; display:grid; place-items:center; padding:24px; text-align:center; color:var(--muted); pointer-events:none; }
    .message b { display:block; margin-bottom:6px; color:var(--ink); font-size:1.2rem; }
    .controls { display:flex; justify-content:center; gap:10px; margin-top:14px; }
    button.start { border:1px solid #38c6a4; border-radius:12px; padding:11px 22px; color:#06221c; background:var(--mint); font:700 1rem inherit; font-weight:750; cursor:pointer; box-shadow:0 5px 18px #3bd6ae33; }
    button.start:hover { background:#83f2d3; transform:translateY(-1px); }
    .tip { margin:12px 0 0; text-align:center; color:#8097a9; font-size:.85rem; }
    @media(max-width:480px) { body{padding:12px}.panel{padding:11px}.arena{min-height:240px}.stat{padding:7px 3px} }
  </style>
</head>
<body>
  <main class="game">
    <header>
      <h1>✨ Złap kropkę</h1>
      <p>Sprawdź refleks — ile razy trafisz w 30 sekund?</p>
    </header>
    <section class="panel" aria-label="Gra Złap kropkę">
      <div class="stats" aria-live="polite">
        <div class="stat">PUNKTY<strong id="score">0</strong></div>
        <div class="stat">CZAS<strong id="time">30</strong></div>
        <div class="stat">REKORD<strong id="best">0</strong></div>
      </div>
      <div class="arena" id="arena">
        <div class="message" id="message"><div><b>Gotowy na wyzwanie?</b>Naciśnij „Start” i klikaj zieloną kropkę!</div></div>
        <button id="target" aria-label="Złap zieloną kropkę"></button>
      </div>
      <div class="controls"><button class="start" id="start">Start gry</button></div>
      <p class="tip">Wskazówka: cel zmienia miejsce po każdym trafieniu.</p>
    </section>
  </main>
  <script>
    const arena = document.querySelector('#arena');
    const target = document.querySelector('#target');
    const message = document.querySelector('#message');
    const scoreText = document.querySelector('#score');
    const timeText = document.querySelector('#time');
    const bestText = document.querySelector('#best');
    const startButton = document.querySelector('#start');

    let score = 0;
    let timeLeft = 30;
    let timer = null;
    let playing = false;
    let best = Number(localStorage.getItem('lap-kropke-rekord') || 0);
    bestText.textContent = best;

    function moveTarget() {
      const padding = 8;
      const maxX = arena.clientWidth - target.offsetWidth - padding;
      const maxY = arena.clientHeight - target.offsetHeight - padding;
      target.style.left = `${padding + Math.random() * Math.max(0, maxX - padding)}px`;
      target.style.top = `${padding + Math.random() * Math.max(0, maxY - padding)}px`;
    }

    function finishGame() {
      playing = false;
      clearInterval(timer);
      target.style.display = 'none';
      message.style.display = 'grid';
      message.innerHTML = `<div><b>Koniec gry! 🎉</b>Zdobyłeś ${score} ${score === 1 ? 'punkt' : 'punktów'}. Zagraj jeszcze raz i pobij rekord!</div>`;
      startButton.textContent = 'Zagraj ponownie';
      if (score > best) {
        best = score;
        localStorage.setItem('lap-kropke-rekord', best);
        bestText.textContent = best;
      }
    }

    function startGame() {
      clearInterval(timer);
      score = 0;
      timeLeft = 30;
      playing = true;
      scoreText.textContent = score;
      timeText.textContent = timeLeft;
      message.style.display = 'none';
      target.style.display = 'block';
      startButton.textContent = 'Gra trwa…';
      moveTarget();
      timer = setInterval(() => {
        timeLeft--;
        timeText.textContent = timeLeft;
        if (timeLeft <= 0) finishGame();
      }, 1000);
    }

    target.addEventListener('click', () => {
      if (!playing) return;
      score++;
      scoreText.textContent = score;
      moveTarget();
    });
    startButton.addEventListener('click', () => { if (!playing) startGame(); });
    window.addEventListener('resize', () => { if (playing) moveTarget(); });
  </script>

</body>
</html>
